[project]
name = "learnloop"
version = "0.10.1"
description = "MCP server that turns what your AI coding agent builds into targeted practice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2,<2",        # v2 renamed FastMCP -> MCPServer; migrate deliberately (see docs/adr/0002)
  "platformdirs>=4",
  "pyyaml>=6",
  "aiosqlite>=0.20",    # Async SQLite for MCP integration
  "fastapi>=0.115",     # Core dependency for local mission control dashboard
  "uvicorn>=0.30",      # ASGI server for local dashboard
  "sse-starlette>=2",   # SSE streaming for real-time dashboard events
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
http = ["fastapi>=0.115", "uvicorn>=0.30", "sse-starlette>=2", "python-multipart>=0.0.12"]

[project.scripts]
learnloop = "learnloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnloop"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]   # T20 bans print(): stdout is the MCP channel
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E702"]

[tool.mypy]
strict = true
files = ["src/learnloop/domain", "src/learnloop/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
