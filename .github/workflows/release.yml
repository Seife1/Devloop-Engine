name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            asset_name: learnloop-linux-x64
            binary_src: dist/learnloop
          - os: windows-latest
            platform: windows-x64
            asset_name: learnloop-windows-x64.exe
            binary_src: dist/learnloop.exe
          - os: macos-latest
            platform: darwin-arm64
            asset_name: learnloop-darwin-arm64
            binary_src: dist/learnloop
          - os: macos-13
            platform: darwin-x64
            asset_name: learnloop-darwin-x64
            binary_src: dist/learnloop

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[http]"
          pip install pyinstaller

      - name: Build Binary
        run: python scripts/build_binary.py

      - name: Rename Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "${{ matrix.binary_src }}" "dist/${{ matrix.asset_name }}" -Force
          Get-Item "dist/${{ matrix.asset_name }}"

      - name: Rename Release Asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mv "${{ matrix.binary_src }}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"
          ls -lh "dist/${{ matrix.asset_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          echo "=== SHA256 Checksums ==="
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
